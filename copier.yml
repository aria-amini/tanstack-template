_min_copier_version: '9'

# The answers file records `template`, so `copier update` renders from the
# same subdirectory.
_subdirectory: templates/{{ template }}

template:
  type: str
  help: App template
  choices:
    - tanstack
    - astro
  default: tanstack

---
!include templates/tanstack/copier.questions.yml
---
!include templates/astro/copier.questions.yml
---
_templates_suffix: '.jinja'

# Value files hold per-instance secrets/local config; never overwrite on update.
# .env.schema remains template-managed as the contract.
_skip_if_exists: []

_exclude:
  # Replaces copier's defaults, so they are repeated here. Paths are relative
  # to the template subdirectory.
  - 'copier.yml'
  - '~*'
  - '*.py[co]'
  - '__pycache__'
  - '.git'
  - '.jj'
  - '.DS_Store'
  - '.svn'
  - 'copier.questions.yml'
  - 'node_modules/**'
  - '{% if template == "astro" and not react %}src/components/counter.tsx{%
    endif %}'
  - .env.local
  - .env.development.local
  - '{% if not sentry %}instrument.server.mjs{% endif %}'
  - '{% if not sentry %}src/instrument.client.ts{% endif %}'
  - '{% if not posthog %}src/lib/analytics/posthog.server.ts{% endif %}'
  - '{% if not posthog %}src/lib/analytics/posthog-proxy.ts{% endif %}'
  - '{% if not posthog %}src/lib/analytics/posthog-proxy.unit.test.ts{% endif %}'
  - '{% if not posthog %}src/routes/api/ingest.$.ts{% endif %}'
  - '{% if not google_auth %}src/components/google-auth-button.tsx{% endif %}'
  - '{% if not google_auth %}src/lib/auth/use-google-auth.ts{% endif %}'

_tasks:
  - '[ -d .jj ] || jj git init --colocate 2>/dev/null || jj git init'
  # copier materializes parent dirs of _excluded files; drop the husks
  - 'find src e2e -depth -type d -empty -delete'

_message_after_copy: |
  Next steps:
    cd {{ _copier_conf.dst_path }}
    mise trust && mise install
    mise run bootstrap
    vp run dev
