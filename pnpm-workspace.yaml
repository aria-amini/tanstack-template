packages:
  - packages/*
catalog:
  '@vitest/browser-playwright': 5.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
# Matches the CI install policy, so local resolution never picks a release
# that CI rejects.
minimumReleaseAge: 1440
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitest: '*'
